<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vedic Kundli AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1e9;
      color: #253047;
    }

    header {
      background: #10243a;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0 0 10px;
      color: #e6c77b;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }

    h2 {
      color: #10243a;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #b58b38;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #96702b;
    }

    #message {
      margin-top: 20px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vedic Kundli AI</h1>
    <p>Discover Your Vedic Birth Chart</p>
    <p>Parashari Astrology | Lahiri Ayanamsha</p>
  </header>

  <main class="container">

    <h2>Enter Your Birth Details</h2>
    <p>Please enter accurate birth information.</p>

    <form id="kundliForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" required>

      <label for="tob">Time of Birth</label>
      <input type="time" id="tob" required>

      <label for="place">Birth Place</label>
      <input type="text" id="place"
             placeholder="City, State, Country" required>

      <label for="language">Report Language</label>
      <select id="language">
        <option value="Hindi">Hindi</option>
        <option value="English">English</option>
        <option value="Hinglish">Hinglish</option>
        <option value="Multi">All Three Languages</option>
      </select>

      <button type="submit">Generate Kundli</button>

    </form>

    <div id="message"></div>

  </main>

  <footer>
    Vedic Kundli AI | Traditional Vedic Astrology
  </footer>

  <script>
document.getElementById("kundliForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");
    const button = this.querySelector("button");

    const name = document.getElementById("name").value;
    const dob = document.getElementById("dob").value;
    const tob = document.getElementById("tob").value;
    const place = document.getElementById("place").value;

    if (!dob || !tob || !place) {
        message.textContent = "Please enter all required birth details.";
        return;
    }

    try {

        button.disabled = true;
        button.textContent = "Finding Birth Details...";

        // Find Birth Place and Time Zone
        const location = await window.findBirthPlace(place);

        // Display Results
        message.style.whiteSpace = "pre-line";

        message.textContent =
            "Birth Details Found Successfully!\n\n" +
            "Name: " + name + "\n" +
            "Birth Place: " + location.name + "\n" +
            "Latitude: " + location.latitude + "\n" +
            "Longitude: " + location.longitude + "\n" +
            "Time Zone: " + location.timeZone + "\n" +
            "Date of Birth: " + dob + "\n" +
            "Time of Birth: " + tob;

    } catch (error) {

        message.textContent = "Error: " + error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Generate Kundli";

    }

});
</script>

  <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/min/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.6.6/builds/moment-timezone-with-data.min.js"></script>
  
<script type="module" src="./calculator.js"></script>
  <script src="./location.js"></script>
</body>
</html>
